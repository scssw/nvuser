<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji 三消游戏</title>
    <style>
        :root {
            --cell-size: 45px;
            --gap: 4px;
            --bg-color: #2c3e50;
            --board-bg: #34495e;
            --highlight: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* 禁止选中文字 */
            touch-action: manipulation;
        }

        h1 { margin-bottom: 10px; font-size: 24px; }

        .info-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(10, var(--cell-size));
            gap: var(--gap);
            background-color: var(--board-bg);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #ecf0f1;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .cell:hover {
            transform: scale(1.05);
        }

        /* 选中状态 */
        .cell.selected {
            background-color: #f1c40f;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transform: scale(1.1);
            z-index: 10;
        }

        /* 消除动画 */
        .cell.matched {
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #c0392b; }

        /* 移动端适配 */
        @media (max-width: 450px) {
            :root {
                --cell-size: 11vw; /* 动态调整大小 */
            }
            #game-board {
                padding: 5px;
            }
        }
    </style>
</head>
<body>

    <h1>Emoji 三消</h1>
    
    <div class="info-panel">
        <span>分数: <b id="score">0</b></span>
    </div>

    <div id="game-board"></div>

    <button onclick="initGame()">重新开始</button>

    <script>
        // 配置参数
        const ROWS = 10;
        const COLS = 8;
        const TYPES = ['🍎', '🍊', '🍇', '🥥', '💎', '🔔', '🌟', '🍄']; // 8种图案
        
        let grid = []; // 存储数据
        let score = 0;
        let selectedCell = null; // 当前选中的格子 {r, c}
        let isProcessing = false; // 防止动画期间重复点击

        const boardEl = document.getElementById('game-board');
        const scoreEl = document.getElementById('score');

        // 初始化游戏
        function initGame() {
            score = 0;
            updateScore(0);
            isProcessing = true;
            selectedCell = null;
            
            // 生成初始网格，确保没有初始匹配
            do {
                createGridData();
            } while (findMatches().length > 0);

            renderBoard();
            isProcessing = false;
        }

        // 创建网格数据
        function createGridData() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push(getRandomType());
                }
                grid.push(row);
            }
        }

        function getRandomType() {
            return TYPES[Math.floor(Math.random() * TYPES.length)];
        }

        // 渲染界面
        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    
                    // 只有当该位置有图案时才显示
                    if (grid[r][c]) {
                        cell.textContent = grid[r][c];
                        cell.onclick = () => handleCellClick(r, c);
                    } else {
                        cell.style.backgroundColor = 'transparent'; // 空位透明
                        cell.style.pointerEvents = 'none';
                    }

                    // 恢复选中状态样式
                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    boardEl.appendChild(cell);
                }
            }
        }

        // 处理点击事件
        function handleCellClick(r, c) {
            if (isProcessing) return; // 动画进行中不响应
            if (!grid[r][c]) return;  // 点击了空位

            // 1. 如果没有选中任何格子，选中当前格子
            if (!selectedCell) {
                selectedCell = { r, c };
                renderBoard();
                return;
            }

            // 2. 如果点击的是已经选中的格子，取消选中
            if (selectedCell.r === r && selectedCell.c === c) {
                selectedCell = null;
                renderBoard();
                return;
            }

            // 3. 检查是否相邻（上下左右）
            const dr = Math.abs(selectedCell.r - r);
            const dc = Math.abs(selectedCell.c - c);
            
            if (dr + dc === 1) {
                // 相邻，尝试交换
                attemptSwap(selectedCell, { r, c });
                selectedCell = null; // 无论是否成功交换，选中状态清除
            } else {
                // 不相邻，更新选中目标为新点击的格子
                selectedCell = { r, c };
                renderBoard();
            }
        }

        // 尝试交换逻辑
        async function attemptSwap(pos1, pos2) {
            isProcessing = true;

            // 在数据层交换
            let temp = grid[pos1.r][pos1.c];
            grid[pos1.r][pos1.c] = grid[pos2.r][pos2.c];
            grid[pos2.r][pos2.c] = temp;

            renderBoard();

            // 检查是否有匹配
            const matches = findMatches();

            if (matches.length > 0) {
                // 交换成功，开始消除流程
                await processMatches();
            } else {
                // 交换无效，换回来
                temp = grid[pos1.r][pos1.c];
                grid[pos1.r][pos1.c] = grid[pos2.r][pos2.c];
                grid[pos2.r][pos2.c] = temp;
                renderBoard();
                isProcessing = false;
            }
        }

        // 查找所有匹配（三个或以上）
        function findMatches() {
            let matchedSet = new Set();

            // 检查横向
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 2; c++) {
                    let type = grid[r][c];
                    if (!type) continue;
                    if (grid[r][c+1] === type && grid[r][c+2] === type) {
                        matchedSet.add(`${r},${c}`);
                        matchedSet.add(`${r},${c+1}`);
                        matchedSet.add(`${r},${c+2}`);
                    }
                }
            }

            // 检查纵向
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS - 2; r++) {
                    let type = grid[r][c];
                    if (!type) continue;
                    if (grid[r+1][c] === type && grid[r+2][c] === type) {
                        matchedSet.add(`${r},${c}`);
                        matchedSet.add(`${r+1},${c}`);
                        matchedSet.add(`${r+2},${c}`);
                    }
                }
            }

            return Array.from(matchedSet).map(str => {
                const [r, c] = str.split(',').map(Number);
                return { r, c };
            });
        }

        // 处理消除、下落、填充的主循环
        async function processMatches() {
            let matches = findMatches();

            while (matches.length > 0) {
                // 1. 播放消除动画并计分
                updateScore(score + matches.length * 10);
                
                // 标记要消除的DOM
                matches.forEach(m => {
                    const index = m.r * COLS + m.c;
                    const cellEl = boardEl.children[index];
                    if(cellEl) cellEl.classList.add('matched');
                });

                // 等待动画完成
                await wait(300);

                // 2. 数据层消除（设为null）
                matches.forEach(m => {
                    grid[m.r][m.c] = null;
                });

                // 3. 重力下落逻辑
                applyGravity();

                // 4. 顶部填充逻辑
                fillTop();

                renderBoard();
                await wait(200); // 短暂的延迟让玩家看到掉落

                // 5. 检查是否产生新的连锁反应
                matches = findMatches();
            }

            isProcessing = false;
        }

        // 处理重力下落
        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                // 从下往上遍历
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (grid[r][c] === null) {
                        // 在当前空位上方寻找最近的非空块
                        for (let k = r - 1; k >= 0; k--) {
                            if (grid[k][c] !== null) {
                                grid[r][c] = grid[k][c];
                                grid[k][c] = null;
                                break;
                            }
                        }
                    }
                }
            }
        }

        // 顶部填充新图案
        function fillTop() {
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    if (grid[r][c] === null) {
                        grid[r][c] = getRandomType();
                    }
                }
            }
        }

        function updateScore(newScore) {
            score = newScore;
            scoreEl.textContent = score;
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 启动游戏
        initGame();

    </script>
</body>
</html>
